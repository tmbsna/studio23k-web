# Netlify: statička stranica studio23k.eu, bez builda.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Stare WordPress adrese (studio23k.eu) na nove stranice, da se ne izgube posjetitelji i Google
[[redirects]]
  from = "/usluge/*"
  to = "/#usluge"
  status = 301
[[redirects]]
  from = "/studio/*"
  to = "/#studio"
  status = 301
[[redirects]]
  from = "/kontakt/*"
  to = "/#kontakt"
  status = 301
[[redirects]]
  from = "/novosti/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/hello-world/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/cjenik/*"
  to = "https://tmbingo.com/cjenik/"
  status = 301
